<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

   <!-- daisyUI & tailwind -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
   <!-- Font awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

     <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
      <nav class="flex justify-between items-center  px-[80px] py-[16px] flex-wrap gap-2 ">
            <div class="flex gap-2 items-center">
                <h1 class="font-bold text-2xl ">CS — Ticket System</h1>
            </div>
            <div class="flex justify-center items-center gap-8 top-actions flex-wrap">
                 <a href="">Home</a>
                 <a href="">FAQ</a>
                 <a href="">Changelog</a>
                 <a href="">Blog</a>
                 <a href="">Download</a>
                 <a href="">Contact</a>
                <button class="btn text-white text-base font-semibold items-center rounded-md  bg-gradient-to-l from-[#9f62f2] to-[#632ee3] hidden sm:flex">+ New Ticket</button>
            </div>
        </nav>
    </header>
    <main class="bg-gray-100 py-10">
  <section class="progress-resolved-bar flex justify-between items-center max-w-[1440px] mx-auto gap-8 px-6">
    <!-- In-Progress -->
    <div class="progress-section flex flex-col items-center justify-center w-1/2 h-[200px]  text-white text-center rounded-lg bg-progress">
      <h1 class="text-xl font-medium mb-3">In-Progress</h1>
      <span class="font-bold text-6xl">0</span>
    </div>

    <!-- Resolved -->
    <div class="resolved-section flex flex-col items-center justify-center w-1/2 h-[200px]  text-white text-center rounded-lg bg-resolved">
      <h1 class="text-xl font-medium mb-3">Resolved</h1>
      <span class="font-bold text-6xl">0</span>
    </div>
  </section>
</main>

    <footer>

    </footer>
</body>
</html>
